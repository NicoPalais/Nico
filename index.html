<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <meta name="description" content="Una pequeña web en construcción. ¡Qué tal!">
  <title>Qué tal — Web en construcción</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#inicio" aria-label="Inicio">
      <span class="brand-mark"><span></span><span></span><span></span></span>
      <span>hola<span class="brand-dot">.</span></span>
    </a>
    <button class="theme-toggle" type="button" aria-label="Cambiar a modo claro" title="Cambiar tema">
      <span class="toggle-icon" aria-hidden="true">☼</span>
      <span class="toggle-label">Modo claro</span>
      <span class="toggle-track"><span class="toggle-knob"></span></span>
    </button>
  </header>

  <main id="inicio">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow"><span class="live-dot"></span> UN NUEVO ESPACIO ESTÁ TOMANDO FORMA</p>
        <h1 id="hero-title">Qué <span class="hello-word">tal<span class="hello-period">.</span></span></h1>
        <p class="intro">Estamos preparando algo bonito.<br>Vuelve pronto y descubre lo que viene.</p>
        <div class="status-pill"><span class="status-icon" aria-hidden="true">✳</span> <span>Web en construcción</span></div>
      </div>

      <div class="artwork" aria-label="Ilustración animada de una obra creativa en proceso" role="img">
        <div class="orbit orbit-outer"></div>
        <div class="orbit orbit-inner"></div>
        <div class="spark spark-a">✳</div>
        <div class="spark spark-b">✦</div>
        <div class="spark spark-c">·</div>
        <div class="planet"><div class="planet-shine"></div><div class="planet-ring"></div></div>
        <div class="construction-card">
          <div class="card-top"><span class="card-dots"><i></i><i></i><i></i></span><span class="card-label">EN PROCESO</span></div>
          <div class="blueprint">
            <div class="blueprint-sun"></div>
            <div class="blueprint-line line-one"></div>
            <div class="blueprint-line line-two"></div>
            <div class="blueprint-line line-three"></div>
            <div class="blueprint-block block-one"></div>
            <div class="blueprint-block block-two"></div>
            <div class="blueprint-dash"></div>
          </div>
          <div class="progress-row"><span>Construyendo la idea</span><span class="progress-number">68%</span></div>
          <div class="progress-bar"><span></span></div>
        </div>
        <div class="mini-note note-left"><span class="note-star">✦</span> buenas ideas</div>
        <div class="mini-note note-right"><span class="note-check">✓</span> pronto</div>
      </div>
    </section>

    <footer class="footer">
      <span>HECHO CON CALMA <span class="footer-heart">♥</span></span>
      <span class="footer-center"><span class="footer-dot"></span> VOLVEMOS ENSEGUIDA</span>
      <span>© <span id="year"></span> — HASTA PRONTO</span>
    </footer>
  </main>
</body>
</html>
